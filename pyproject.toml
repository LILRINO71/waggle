[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waggle-agent"
version = "0.1.0"
description = "Personal AI agent: local model + Sonnet routing + Opus background builds, Obsidian memory, Pro-quota budget"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
waggle = "waggle.cli:main"

[tool.setuptools]
packages = ["waggle", "waggle.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
